name: Build Gabung Media (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Kalau ada file .zip di folder utama repo, zip itu diekstrak otomatis di runner.
      # Kalau tidak ada, dipakai lib/ + pubspec.yaml di repo.
      - name: Siapkan sumber aplikasi
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter *.zip -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($zip) {
            Write-Host "Ekstrak $($zip.Name)"
            Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\src" -Force
            $pub = Get-ChildItem -Path "$env:RUNNER_TEMP\src" -Recurse -Filter pubspec.yaml | Select-Object -First 1
            if (-not $pub) { throw "pubspec.yaml tidak ditemukan di dalam zip" }
            $dir = $pub.Directory.FullName
          } elseif (Test-Path pubspec.yaml) {
            $dir = (Get-Location).Path
          } else {
            throw "Tidak ada pubspec.yaml maupun file .zip di repo"
          }
          "APP_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "APP_DIR=$dir"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat proyek Windows (runner) bila belum ada
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          if (-not (Test-Path windows)) {
            flutter create --platforms=windows --project-name gabung_media --org com.gabung .
          }
          if (Test-Path test) { Remove-Item test -Recurse -Force }

      - name: Ambil dependensi
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build Windows (release)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build windows --release

      - name: Sertakan ffmpeg
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $rel = "build\windows\x64\runner\Release"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          New-Item -ItemType Directory -Force "$rel\ffmpeg" | Out-Null
          $bin = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName "$rel\ffmpeg\ffmpeg.exe"
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") "$rel\ffmpeg\ffprobe.exe"

      - name: Zip hasil
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "$env:GITHUB_WORKSPACE\GabungMedia-Windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: GabungMedia-Windows
          path: GabungMedia-Windows.zip

      - name: Rilis (jika tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GabungMedia-Windows.zip
